let busy = false;
async function ask(text, again){
  const q = String(text || $('#q').value || '').trim();
  if (!q || busy) return;
  if (!again){
    $('#q').value = '';
    $('#q').style.height = 'auto';
    syncCount();
  }
  const empty = $('#empty');
  if (empty) empty.remove();

  busy = true;
  $('#send').disabled = true;
  renderQuestion(q);
  const loading = renderLoading();
  runPipeline();

  try{
    const t0 = performance.now();
    const data = await api('/ask', { question: q, top_k: 5 });
    data.elapsed_ms = Math.round(performance.now() - t0);
    clearPipeline();
    loading.remove();
    S.current = data;
    S.history.push({ q: q, a: data.answer, refused: data.refused, at: new Date().toISOString() });
    renderAnswer(data);
    renderEvidence(data);
    switchTab('evidence');
    openInspector(true);
    if (data.refused) toast('证据不足，已按规则拒答（不猜、不编）', 'warn');
  }catch(e){
    clearPipeline();
    loading.remove();
    const card = h('div', { class:'anscard refused' },
      h('div', { class:'ans-head' }, h('span', { class:'verdict no' }, icon('alert', 11), '请求失败')),
      h('div', { class:'ans-body' }, h('div', { text: String(e && e.message || e) }))
    );
    $('#log').append(h('div', { class:'arow' }, card));
    toast('请求失败：' + (e && e.message || e), 'err');
  }finally{
    busy = false;
    $('#send').disabled = false;
    $('#q').focus();
  }
}

/* ---------- 10. 面板开关 / Tab ---------- */
function openInspector(open){
  const el = $('#inspector');
  if (!el) return;
  el.dataset.open = open ? 'true' : 'false';
  $('#btnInsp').setAttribute('aria-pressed', open ? 'true' : 'false');
  if (window.innerWidth <= 1080 && open){
    el.classList.add('drawer');
    // 移动端：点击空白处关闭
    setTimeout(() => {
      const close = (ev) => {
        if (!el.contains(ev.target) && ev.target.id !== 'btnInsp'){
          openInspector(false); document.removeEventListener('click', close);
        }
      };
      document.addEventListener('click', close);
    }, 0);
  }
}

function switchTab(name){
  S.tab = name;
  $$('.tab').forEach(t => t.setAttribute('aria-selected', String(t.dataset.pane === name)));
  $$('.pane').forEach(p => p.classList.toggle('active', p.id === 'pane-' + name));
  if (name === 'evidence' && S.current) renderEvidence(S.current);
  if (name === 'evidence' && !S.current) renderEvidenceEmpty();
}

/* ---------- 11. 命令面板 ---------- */
function cmdkItems(query){
  const q = String(query || '').trim().toLowerCase();
  const items = [];
  const push = (group, label, sub, ico, run) => items.push({ group, label, sub, ico, run });

  EXAMPLES.forEach(t => push('提问', t, 'Enter 直接发送', 'search', () => ask(t)));
  push('面板', '打开证据面板', '本次检索链路', 'layers', () => { switchTab('evidence'); openInspector(true); });
  push('面板', '打开时间脉络', '通知发布顺序', 'clock', () => { switchTab('timeline'); openInspector(true); });
  push('面板', '打开消融评测', '24 题基准集', 'chart', () => { switchTab('eval'); openInspector(true); });
  push('操作', '清空当前对话', '保留知识库', 'trash', clearLog);
  push('操作', '导出全部对话为 Markdown', S.history.length + ' 轮', 'download', exportAll);
  push('操作', '下载截止日历 (.ics)', 'RFC 5545', 'calendar', () => {
    if (S.lastIcs){ downloadIcs(S.lastIcs, 'notice-deadline.ics'); toast('已下载日历文件', 'ok'); }
    else ask('省赛作品提交截止是哪一天？');
  });
  ((S.overview && S.overview.timeline) || []).forEach(d => {
    push('文档', d.title, (d.published_at || '') + ' · 权威 ' + d.authority, 'book', () => {
      if (d.source_url) window.open(d.source_url, '_blank', 'noopener');
      else toast('该文档没有可核验的公开链接', 'warn');
    });
  });
  if (!q) return items;
  return items.filter(it => (it.label + ' ' + it.sub + ' ' + it.group).toLowerCase().includes(q));
}

function renderCmdk(query){
  const list = $('#cmdkList');
  clear(list);
  const items = cmdkItems(query);
  S.cdk.items = items;
  if (!items.length){
    list.append(h('div', { class:'cmdk-group', text:'没有匹配项' }));
    S.cdk.idx = 0;
    return;
  }
  if (S.cdk.idx >= items.length) S.cdk.idx = 0;
  let lastGroup = null;
  items.forEach((it, i) => {
    if (it.group !== lastGroup){
      list.append(h('div', { class:'cmdk-group', text: it.group }));
      lastGroup = it.group;
    }
    const b = h('button', { class:'cmdk-item' + (i === S.cdk.idx ? ' sel' : ''), type:'button' },
      icon(it.ico, 14), h('span', { text: it.label }), h('span', { class:'sub', text: it.sub })
    );
    b.addEventListener('click', () => runCmdk(i));
    b.addEventListener('mousemove', () => { if (S.cdk.idx !== i){ S.cdk.idx = i; paintSel(); } });
    list.append(b);
  });
}
function paintSel(){
  $$('.cmdk-item').forEach((n, i) => n.classList.toggle('sel', i === S.cdk.idx));
  const sel = $('.cmdk-item.sel');
  if (sel) sel.scrollIntoView({ block:'nearest' });
}
function runCmdk(i){
  const it = S.cdk.items[i];
  if (!it) return;
  closeScrims();
  it.run();
}
function openCmdk(){
  $('#cmdkScrim').classList.add('open');
  const input = $('#cmdkInput');
  input.value = '';
  S.cdk.idx = 0;
  renderCmdk('');
  setTimeout(() => input.focus(), 30);
}
function closeScrims(){
  $('#cmdkScrim').classList.remove('open');
  $('#helpScrim').classList.remove('open');
}

/* ---------- 12. 其它动作 ---------- */
function clearLog(){
  S.current = null;
  S.history = [];
  S.feedback = null;
  const log = $('#log');
  clear(log);
  renderEmpty();
  if (S.overview && S.overview.deadline) startCountdown(S.overview.deadline);
  renderEvidenceEmpty();
  toast('对话已清空，知识库未受影响', '');
}

function exportAll(){
  if (!S.history.length){ toast('还没有可导出的问答', 'warn'); return; }
  const lines = ['# 校务 / 赛事通知可信问答 · 会话记录', '', '导出时间：' + new Date().toLocaleString('zh-CN'), ''];
  S.history.forEach((x, i) => {
    lines.push('## ' + (i + 1) + '. ' + x.q, '', x.a, '');
    if (x.refused) lines.push('_本题因证据不足被拒答_', '');
  });
  lines.push('---', '仅包含本会话提问与答案；引用与原文请回看页面右侧证据面板。');
  downloadText(lines.join('\n'), 'notice-session-' + Date.now() + '.md');
  toast('已导出 ' + S.history.length + ' 轮对话', 'ok');
}

function syncCount(){
  const n = ($('#q').value || '').length;
  $('#charCount').textContent = n + ' 字';
}

const KEYROWS = [
  ['打开命令面板', ['Ctrl', 'K']],
  ['聚焦输入框', ['/']],
  ['发送问题', ['Enter']],
  ['换行', ['Shift', 'Enter']],
  ['关闭浮层', ['Esc']],
  ['查看本页快捷键', ['?']]
];
function renderKeyrows(){
  const box = $('#keyrows');
  clear(box);
  KEYROWS.forEach(([label, keys]) => {
    box.append(h('div', { class:'keyrow' },
      h('span', { text: label }),
      h('span', { class:'keys' }, keys.map(k => h('span', { class:'kbd', text:k })))
    ));
  });
}

/* ---------- 13. 事件绑定 ---------- */
function bindEvents(){
  $('#send').addEventListener('click', () => ask());
  $('#btnCmd').addEventListener('click', openCmdk);
  $('#btnHelp').addEventListener('click', () => { $('#helpScrim').classList.add('open'); });
  $('#btnInsp').addEventListener('click', () => {
    openInspector($('#inspector').dataset.open !== 'true');
  });
  $('#btnFocus').addEventListener('click', () => $('#q').focus());
  $('#btnClear').addEventListener('click', clearLog);
  $('#btnExportAll').addEventListener('click', exportAll);

  $$('.tab').forEach(t => t.addEventListener('click', () => switchTab(t.dataset.pane)));

  const ta = $('#q');
  ta.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && !e.shiftKey && !e.isComposing){ e.preventDefault(); ask(); }
  });
  ta.addEventListener('input', () => {
    ta.style.height = 'auto';
    ta.style.height = Math.min(ta.scrollHeight, 150) + 'px';
    syncCount();
  });

  document.addEventListener('keydown', (e) => {
    const tag = (e.target.tagName || '').toLowerCase();
    const typing = tag === 'input' || tag === 'textarea';
    if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'k'){
      e.preventDefault();
      if ($('#cmdkScrim').classList.contains('open')) closeScrims(); else openCmdk();
      return;
    }
    if (e.key === 'Escape'){ closeScrims(); return; }
    if (!typing && e.key === '/'){ e.preventDefault(); ta.focus(); return; }
    if (!typing && e.key === '?'){ e.preventDefault(); $('#helpScrim').classList.add('open'); return; }
    if ($('#cmdkScrim').classList.contains('open')){
      if (e.key === 'ArrowDown'){ e.preventDefault(); S.cdk.idx = Math.min(S.cdk.idx + 1, S.cdk.items.length - 1); paintSel(); }
      if (e.key === 'ArrowUp'){ e.preventDefault(); S.cdk.idx = Math.max(S.cdk.idx - 1, 0); paintSel(); }
      if (e.key === 'Enter'){ e.preventDefault(); runCmdk(S.cdk.idx); }
    }
  });

  $('#cmdkInput').addEventListener('input', (e) => { S.cdk.idx = 0; renderCmdk(e.target.value); });
  $('#cmdkScrim').addEventListener('click', (e) => { if (e.target.id === 'cmdkScrim') closeScrims(); });
  $('#helpScrim').addEventListener('click', (e) => { if (e.target.id === 'helpScrim') closeScrims(); });

  document.addEventListener('visibilitychange', () => {
    if (!document.hidden && S.overview && S.overview.deadline && !S.deadlineTimer) startCountdown(S.overview.deadline);
  });
}

/* ---------- 14. 粒子背景（独立模块，可被减弱动效关闭） ---------- */
(function particles(){
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  if (reduce) return;
  const canvas = document.createElement('canvas');
  canvas.id = 'bg-particles';
  document.body.prepend(canvas);
  const ctx = canvas.getContext('2d');
  if (!ctx) { canvas.remove(); return; }
  let W = 0, H = 0, pts = [], raf = null, running = false, slowFrames = 0, quality = 1;
  const mouse = { x: -1e4, y: -1e4 };
  const LINK = 118, MOUSE_LINK = 155;

  function resize(){
    const dpr = Math.min(window.devicePixelRatio || 1, 1.5);
    W = window.innerWidth; H = window.innerHeight;
    canvas.width = Math.round(W * dpr);
    canvas.height = Math.round(H * dpr);
    canvas.style.width = W + 'px';
    canvas.style.height = H + 'px';
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    const base = Math.max(22, Math.min(80, Math.round(W * H / 17000)));
    const count = Math.round((W < 768 ? base * 0.45 : base) * quality);
    pts = Array.from({ length: count }, () => ({
      x: Math.random() * W, y: Math.random() * H,
      vx: (Math.random() - .5) * .34, vy: (Math.random() - .5) * .34,
      r: Math.random() * 1.5 + .7,
      cool: Math.random() < .5
    }));
  }

  let last = 0;
  function tick(now){
    const dt = last ? now - last : 16;
    last = now;
    // 自适应降级：连续慢帧则减少粒子，避免低端设备掉帧
    if (dt > 26){
      slowFrames++;
      if (slowFrames > 45 && quality > 0.45){ quality = 0.45; slowFrames = 0; resize(); }
    }else if (slowFrames > 0) slowFrames--;

    ctx.clearRect(0, 0, W, H);
    ctx.globalCompositeOperation = 'lighter';
    for (const p of pts){
      p.x += p.vx; p.y += p.vy;
      if (p.x < -20) p.x = W + 20; else if (p.x > W + 20) p.x = -20;
      if (p.y < -20) p.y = H + 20; else if (p.y > H + 20) p.y = -20;
    }
    for (let i = 0; i < pts.length; i++){
      const a = pts[i];
      for (let j = i + 1; j < pts.length; j++){
        const b = pts[j];
        const dx = a.x - b.x, dy = a.y - b.y;
        const d2 = dx * dx + dy * dy;
        if (d2 < LINK * LINK){
          const t = 1 - Math.sqrt(d2) / LINK;
          ctx.strokeStyle = 'rgba(86,180,255,' + (t * .13).toFixed(3) + ')';
          ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y); ctx.stroke();
        }
      }
      const dxm = a.x - mouse.x, dym = a.y - mouse.y;
      const dm2 = dxm * dxm + dym * dym;
      if (dm2 < MOUSE_LINK * MOUSE_LINK){
        const t = 1 - Math.sqrt(dm2) / MOUSE_LINK;
        ctx.strokeStyle = 'rgba(120,240,255,' + (t * .22).toFixed(3) + ')';
        ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(mouse.x, mouse.y); ctx.stroke();
      }
    }
    for (const p of pts){
      ctx.fillStyle = p.cool ? 'rgba(56,217,255,.55)' : 'rgba(139,123,255,.50)';
      ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, 6.2832); ctx.fill();
    }
    ctx.globalCompositeOperation = 'source-over';
    raf = requestAnimationFrame(tick);
  }
  function start(){ if (!running){ running = true; last = 0; raf = requestAnimationFrame(tick); } }
  function stop(){ running = false; if (raf){ cancelAnimationFrame(raf); raf = null; } }

  window.addEventListener('resize', resize, { passive: true });
  window.addEventListener('mousemove', (e) => { mouse.x = e.clientX; mouse.y = e.clientY; }, { passive: true });
  window.addEventListener('mouseleave', () => { mouse.x = -1e4; mouse.y = -1e4; });
  document.addEventListener('visibilitychange', () => document.hidden ? stop() : start());
  resize();
  start();
})();

/* ---------- 15. 启动 ---------- */
$('#cmdIcon').append(icon('cmd', 13));
renderKeyrows();
bindEvents();
renderEmpty();
boot();
syncCount();

/* 可直接分享的链接：
   #q=<问题>          打开即提问
   #tab=evidence|timeline|eval  直达某个面板 */
const params = new URLSearchParams(location.hash.slice(1));
const presetTab = params.get('tab');
if (presetTab && ['evidence','timeline','eval'].includes(presetTab)) switchTab(presetTab);
const preset = params.get('q');
if (preset) setTimeout(() => ask(preset), 200);
</script>
